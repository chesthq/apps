name: Sync chest SKILL.md from chest.sh

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render SKILL.md from chest.sh/skill.md
        run: node scripts/render-skill.mjs

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-skill-md
          commit-message: 'chore: sync chest SKILL.md from chest.sh'
          title: 'chore: sync chest SKILL.md from chest.sh'
          body: |
            Automated sync of `plugins/chest/skills/chest/SKILL.md` from
            <https://chest.sh/skill.md>.

            Bump `plugins/chest/.claude-plugin/plugin.json` `version` if the
            change is user-visible.
          add-paths: |
            plugins/chest/skills/chest/SKILL.md
